  <text x="64" y="308" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Dado do tipo</text>
  <rect x="64" y="320" width="640" height="48" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="64" y="408" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Código do exemplar</text>
  <rect x="64" y="420" width="640" height="48" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <rect x="64" y="496" width="200" height="48" fill="#dbeafe" stroke="#111111" stroke-width="2" rx="8"/>
