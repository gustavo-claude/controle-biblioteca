<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" width="1280" height="980">
  <rect width="1280" height="980" fill="#ffffff"/>

  <text x="40" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Frame A - Página pública</text>
  <text x="40" y="78" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 1 - Abrir a página pública de consulta, sem login</text>
  <text x="40" y="116" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 2 - Informar um dado do tipo ou o código do exemplar</text>
  <text x="40" y="154" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passos 3a, 3b e 3c - alternativas de resultado, não uma sequência</text>

  <rect x="40" y="188" width="1200" height="752" fill="#ffffff" stroke="#111111" stroke-width="2.5" rx="16"/>
