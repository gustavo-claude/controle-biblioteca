<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1900" width="1600" height="1900">
  <rect width="1600" height="1900" fill="#ffffff"/>

  <text x="48" y="44" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Frame A - Relatório do acervo</text>
  <text x="48" y="86" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 1 - Abrir a área de relatórios</text>
  <text x="48" y="122" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 2 - Escolher o recorte de tipo: todas as obras ou um tipo</text>
  <text x="48" y="158" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 3 - Escolher o recorte de permanência: todas as obras já cadastradas</text>
  <text x="48" y="194" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">ou apenas as que ainda não foram removidas</text>
  <text x="48" y="230" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 4 - Emitir o relatório do acervo</text>

  <rect x="48" y="258" width="1504" height="600" fill="#ffffff" stroke="#111111" stroke-width="2.5" rx="16"/>
  <text x="80" y="306" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Biblioteca Limoeiro</text>

  <rect x="80" y="330" width="160" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="160" y="358" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Acervo</text>
  <rect x="256" y="330" width="190" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="351" y="358" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Usuários</text>
  <rect x="462" y="330" width="220" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="572" y="358" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Empréstimos</text>
  <rect x="698" y="330" width="200" height="44" fill="#dbeafe" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="798" y="358" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Relatórios</text>

  <line x1="80" y1="394" x2="1520" y2="394" stroke="#111111" stroke-width="1.5"/>

  <text x="80" y="448" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Recorte de tipo</text>
  <circle cx="92" cy="496" r="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="116" y="502" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Todas as obras</text>
  <circle cx="92" cy="548" r="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="116" y="554" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Um tipo</text>

  <text x="80" y="612" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Recorte de permanência</text>
  <circle cx="92" cy="660" r="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="116" y="666" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Todas as obras já cadastradas</text>
  <circle cx="92" cy="712" r="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="116" y="718" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Apenas as que ainda não foram removidas</text>

  <rect x="80" y="760" width="280" height="48" fill="#dbeafe" stroke="#111111" stroke-width="2" rx="8"/>
  <text x="220" y="790" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Emitir relatório</text>

  <line x1="780" y1="882" x2="780" y2="946" stroke="#111111" stroke-width="2"/>
  <polygon points="772,938 788,938 780,956" fill="#111111"/>
  <text x="808" y="920" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">O gestor emite o relatório.</text>

  <text x="48" y="1000" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Frame B - Relatório emitido</text>
  <text x="48" y="1036" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 5 - Ver a data de inclusão de cada obra</text>
  <text x="48" y="1072" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 6a - Ver o último empréstimo e o status desse empréstimo</text>
  <text x="48" y="1108" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 6b - Ver a obra sem último empréstimo</text>
  <text x="48" y="1144" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 7 - Ver a mensagem operação feita com sucesso</text>

  <rect x="48" y="1172" width="1504" height="620" fill="#ffffff" stroke="#111111" stroke-width="2.5" rx="16"/>
  <text x="80" y="1220" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Biblioteca Limoeiro</text>

  <rect x="80" y="1244" width="160" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="160" y="1272" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Acervo</text>
  <rect x="256" y="1244" width="190" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="351" y="1272" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Usuários</text>
  <rect x="462" y="1244" width="220" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="572" y="1272" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Empréstimos</text>
  <rect x="698" y="1244" width="200" height="44" fill="#dbeafe" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="798" y="1272" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Relatórios</text>

  <line x1="80" y1="1316" x2="1520" y2="1316" stroke="#111111" stroke-width="1.5"/>

  <rect x="80" y="1356" width="1100" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.8" rx="12"/>
  <text x="80" y="1524" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Data de inclusão</text>
  <text x="80" y="1564" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Último empréstimo</text>
  <text x="80" y="1604" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Status desse empréstimo</text>
  <text x="80" y="1668" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Sem último empréstimo</text>
  <text x="80" y="1728" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">operação feita com sucesso</text>

  <text x="48" y="1852" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">O log guarda o recorte, sem valor anterior e sem valor novo.</text>
</svg>
