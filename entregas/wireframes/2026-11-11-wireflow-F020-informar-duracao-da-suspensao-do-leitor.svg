<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1200" width="1680" height="1200">
  <rect width="1680" height="1200" fill="#ffffff"/>
  <line x1="80" y1="28" x2="80" y2="120" stroke="#111111" stroke-width="2.5"/>
  <polygon points="68,120 92,120 80,140" fill="#111111"/>
  <text x="112" y="96" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Receber o exemplar atrasado com a chave ligada.</text>
  <text x="40" y="188" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Frame A - Devolução</text>
  <text x="40" y="226" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 1. Receber o exemplar do empréstimo atrasado, na devolução</text>
  <text x="40" y="264" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 2a. Se a chave está desligada, encerrar sem suspensão</text>
  <text x="40" y="302" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 2b. Informar a duração da suspensão</text>
  <text x="40" y="340" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 3. Ver o leitor suspenso por essa duração</text>
  <text x="40" y="378" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 4. Ver a mensagem operação feita com sucesso, quando a duração é informada</text>
  <rect x="40" y="402" width="980" height="748" fill="#ffffff" stroke="#111111" stroke-width="2.5" rx="16"/>
  <text x="64" y="442" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Biblioteca Limoeiro</text>
  <rect x="64" y="462" width="150" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="139" y="490" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Acervo</text>
  <rect x="226" y="462" width="170" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="311" y="490" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Usuários</text>
  <rect x="408" y="462" width="210" height="44" fill="#dbeafe" stroke="#111111" stroke-width="2" rx="8"/>
  <text x="513" y="490" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Empréstimos</text>
  <rect x="630" y="462" width="190" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="725" y="490" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Relatórios</text>
  <line x1="64" y1="526" x2="996" y2="526" stroke="#111111" stroke-width="1.5"/>
  <text x="64" y="566" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Identificação do empréstimo</text>
  <rect x="64" y="578" width="640" height="48" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="64" y="666" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Empréstimo</text>
  <rect x="64" y="678" width="210" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="169" y="706" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Devolvido</text>
  <text x="64" y="762" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Exemplar</text>
  <rect x="64" y="774" width="230" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="179" y="802" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Disponível</text>
  <text x="64" y="858" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Duração da suspensão</text>
  <rect x="64" y="870" width="640" height="48" fill="#dbeafe" stroke="#111111" stroke-width="2" rx="8"/>
  <text x="64" y="958" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Leitor suspenso</text>
  <rect x="64" y="990" width="420" height="52" fill="#dbeafe" stroke="#111111" stroke-width="2" rx="8"/>
  <text x="274" y="1022" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Registrar a devolução</text>
  <text x="64" y="1094" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">operação feita com sucesso</text>
  <text x="1064" y="858" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Não há quantidade fixa de dias.</text>
  <text x="1064" y="892" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">O leitor fica suspenso.</text>
  <text x="1064" y="934" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Nenhum gestor registra novo</text>
  <text x="1064" y="968" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">empréstimo enquanto a</text>
  <text x="1064" y="1002" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">suspensão vale.</text>
  <text x="1064" y="1044" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Não há tela própria.</text>
</svg>
