  <text x="40" y="78" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 1. Abrir a área de gestão de empréstimos</text>
  <text x="40" y="116" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 2. Identificar o empréstimo ativo ou atrasado</text>
