  <text x="64" y="964" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Empréstimo</text>
  <rect x="64" y="976" width="380" height="48" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="254" y="1006" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Encerrado por extravio</text>
  <text x="64" y="1064" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Exemplar</text>
  <rect x="64" y="1076" width="240" height="48" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="184" y="1106" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Indisponível</text>
  <rect x="64" y="1152" width="400" height="52" fill="#dbeafe" stroke="#111111" stroke-width="2" rx="8"/>
  <text x="264" y="1184" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Encerrar por extravio</text>
  <text x="64" y="1256" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">operação feita com sucesso</text>
  <text x="1064" y="964" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Não volta a ativo, atrasado</text>
  <text x="1064" y="998" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">ou devolvido.</text>
  <text x="1064" y="1040" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Deixa de contar no máximo</text>
  <text x="1064" y="1074" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">em paralelo.</text>
  <text x="1064" y="1116" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">A remoção da obra e a do</text>
  <text x="1064" y="1150" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">exemplar podem seguir.</text>
