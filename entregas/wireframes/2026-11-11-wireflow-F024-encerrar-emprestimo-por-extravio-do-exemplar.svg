  <line x1="64" y1="264" x2="996" y2="264" stroke="#111111" stroke-width="1.5"/>
  <text x="64" y="300" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Lista</text>
  <rect x="64" y="316" width="912" height="156" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="88" y="348" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Ativo</text>
  <text x="400" y="348" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Atrasado</text>
  <line x1="80" y1="364" x2="960" y2="364" stroke="#111111" stroke-width="1.5"/>
  <line x1="80" y1="524" x2="80" y2="632" stroke="#111111" stroke-width="2.5"/>
