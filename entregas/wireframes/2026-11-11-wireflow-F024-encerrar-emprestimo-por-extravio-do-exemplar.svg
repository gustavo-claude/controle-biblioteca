  <rect x="226" y="860" width="170" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="311" y="888" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Usuários</text>
  <rect x="408" y="860" width="210" height="44" fill="#dbeafe" stroke="#111111" stroke-width="2" rx="8"/>
  <text x="513" y="888" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Empréstimos</text>
  <rect x="630" y="860" width="190" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="725" y="888" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Relatórios</text>
