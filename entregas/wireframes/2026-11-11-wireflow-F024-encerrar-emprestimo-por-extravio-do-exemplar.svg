  <text x="112" y="596" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Encerrar o empréstimo por extravio.</text>
  <text x="40" y="700" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Frame B - Extravio</text>
  <text x="40" y="738" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 3. Encerrar o empréstimo por extravio</text>
  <text x="40" y="776" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 4. Ver a mensagem operação feita com sucesso</text>
  <rect x="40" y="800" width="980" height="520" fill="#ffffff" stroke="#111111" stroke-width="2.5" rx="16"/>
  <text x="64" y="840" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Biblioteca Limoeiro</text>
