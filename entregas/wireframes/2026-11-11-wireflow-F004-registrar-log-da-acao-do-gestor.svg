<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <rect width="1600" height="1080" fill="#ffffff"/>

  <text x="48" y="44" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Frame A - Ação concluída</text>
  <text x="48" y="86" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 1 - Concluir uma ação do gestor que altera cadastro, configuração,</text>
  <text x="48" y="122" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">status de exemplar ou de empréstimo, ou que emite relatório</text>
  <text x="48" y="166" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 2b - Registrar o log da ação, sem a senha</text>
  <text x="48" y="202" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 3 - Mostrar, na tela da ação, a mensagem operação feita com sucesso</text>

  <rect x="48" y="230" width="1504" height="480" fill="#ffffff" stroke="#111111" stroke-width="2.5" rx="16"/>
  <text x="80" y="278" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Biblioteca Limoeiro</text>

  <rect x="80" y="302" width="160" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="160" y="330" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Acervo</text>
  <rect x="256" y="302" width="190" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="351" y="330" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Usuários</text>
  <rect x="462" y="302" width="220" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="572" y="330" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Empréstimos</text>
  <rect x="698" y="302" width="200" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="798" y="330" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Relatórios</text>

  <line x1="80" y1="366" x2="1520" y2="366" stroke="#111111" stroke-width="1.5"/>

  <text x="80" y="450" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">operação feita com sucesso</text>
  <rect x="80" y="486" width="200" height="48" fill="#dbeafe" stroke="#111111" stroke-width="2" rx="8"/>
  <text x="180" y="516" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Concluir</text>

  <text x="48" y="758" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">O log guarda data e hora, o gestor, a ação, o que mudou, a identificação, o valor anterior e o valor novo.</text>
  <text x="48" y="794" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Na inclusão, o valor anterior fica vazio.</text>
  <text x="48" y="830" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Na remoção, o valor novo é a remoção.</text>
  <text x="48" y="866" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">No relatório, guarda o recorte e não guarda valor anterior nem novo.</text>
  <text x="48" y="902" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">A senha não entra.</text>
  <text x="48" y="938" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Uma ação que altera exemplar e empréstimo gera um log, com os dois resultados.</text>
  <text x="48" y="974" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Sem esta mensagem: consulta, pesquisa, painel, recusa sem gravação, atraso automático,</text>
  <text x="48" y="1010" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">fim da suspensão e criação do primeiro gestor.</text>
</svg>
