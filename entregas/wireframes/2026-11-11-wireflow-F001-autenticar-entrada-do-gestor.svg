<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400">
  <rect width="1200" height="1400" fill="#ffffff"/>

  <text x="48" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Frame A - Tela de login</text>
  <text x="48" y="76" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Passo 1 - Informar o usuário</text>
  <text x="48" y="112" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Passo 2 - Informar a senha</text>
  <text x="48" y="148" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Passo 3a - Ver a mensagem de senha errada e permanecer na tela de login</text>
  <text x="48" y="184" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Passo 3b - Ver a mensagem de usuário não cadastrado e permanecer na tela de login</text>

  <rect x="48" y="208" width="720" height="460" fill="#ffffff" stroke="#111111" stroke-width="2.5" rx="16"/>
  <text x="408" y="264" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Login</text>
  <text x="168" y="318" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Usuário</text>
  <rect x="168" y="330" width="480" height="48" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="168" y="418" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Senha</text>
  <rect x="168" y="430" width="480" height="48" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <rect x="168" y="506" width="480" height="52" fill="#dbeafe" stroke="#111111" stroke-width="2" rx="8"/>
  <text x="408" y="538" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Entrar</text>
  <line x1="168" y1="592" x2="420" y2="592" stroke="#111111" stroke-width="1.5"/>

  <text x="800" y="584" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Senha errada.</text>
  <text x="800" y="620" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Usuário não cadastrado.</text>

  <line x1="640" y1="692" x2="640" y2="808" stroke="#111111" stroke-width="2"/>
  <polygon points="628,808 652,808 640,824" fill="#111111"/>
  <text x="688" y="748" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Usuário e senha autorizam a entrada.</text>

  <text x="48" y="736" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Frame B - Tela inicial</text>
  <text x="48" y="780" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Passo 3c - Abrir a tela inicial</text>

  <rect x="48" y="824" width="720" height="520" fill="#ffffff" stroke="#111111" stroke-width="2.5" rx="16"/>
  <text x="88" y="876" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Tela inicial</text>
  <rect x="88" y="912" width="306" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.8" rx="8"/>
  <text x="241" y="998" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Acervo</text>
  <rect x="422" y="912" width="306" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.8" rx="8"/>
  <text x="575" y="998" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Usuários</text>
  <rect x="88" y="1096" width="306" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.8" rx="8"/>
  <text x="241" y="1182" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Empréstimos</text>
  <rect x="422" y="1096" width="306" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.8" rx="8"/>
  <text x="575" y="1182" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Relatórios</text>
</svg>
