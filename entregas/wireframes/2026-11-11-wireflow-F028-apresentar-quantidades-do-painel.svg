<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <rect width="1600" height="1160" fill="#ffffff"/>

  <text x="48" y="44" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#111111">Frame A - Painel</text>
  <text x="48" y="86" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 1 - Abrir a área de relatórios</text>
  <text x="48" y="122" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 2 - Abrir o painel</text>
  <text x="48" y="158" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Passo 3 - Ver a quantidade de obras cadastradas, de leitores com empréstimo nos últimos 6 meses,</text>
  <text x="48" y="194" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">de empréstimos ativos e de empréstimos atrasados</text>

  <rect x="48" y="226" width="1504" height="660" fill="#ffffff" stroke="#111111" stroke-width="2.5" rx="16"/>
  <text x="80" y="274" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111">Biblioteca Limoeiro</text>

  <rect x="80" y="298" width="160" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="160" y="326" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Acervo</text>
  <rect x="256" y="298" width="190" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="351" y="326" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Usuários</text>
  <rect x="462" y="298" width="220" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="572" y="326" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">Empréstimos</text>
  <rect x="698" y="298" width="200" height="44" fill="#dbeafe" stroke="#111111" stroke-width="1.5" rx="8"/>
  <text x="798" y="326" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Relatórios</text>

  <line x1="80" y1="362" x2="1520" y2="362" stroke="#111111" stroke-width="1.5"/>

  <rect x="80" y="400" width="700" height="140" fill="#ffffff" stroke="#111111" stroke-width="1.8" rx="12"/>
  <text x="430" y="480" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">[ ]</text>
  <text x="80" y="576" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Obras cadastradas</text>

  <rect x="820" y="400" width="700" height="140" fill="#ffffff" stroke="#111111" stroke-width="1.8" rx="12"/>
  <text x="1170" y="480" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">[ ]</text>
  <text x="820" y="576" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Leitores com empréstimo nos últimos 6 meses</text>

  <rect x="80" y="620" width="700" height="140" fill="#ffffff" stroke="#111111" stroke-width="1.8" rx="12"/>
  <text x="430" y="700" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">[ ]</text>
  <text x="80" y="796" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Empréstimos ativos</text>

  <rect x="820" y="620" width="700" height="140" fill="#ffffff" stroke="#111111" stroke-width="1.8" rx="12"/>
  <text x="1170" y="700" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111" text-anchor="middle">[ ]</text>
  <text x="820" y="796" font-family="Segoe UI, sans-serif" font-size="18" fill="#111111">Empréstimos atrasados</text>

  <text x="48" y="954" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Leitor com empréstimo nos últimos 6 meses tem ao menos um empréstimo cuja data de retirada</text>
  <text x="48" y="990" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">está nos 6 meses anteriores à consulta.</text>
  <text x="48" y="1026" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">Esse número não é a lista de leitores com empréstimo ativo.</text>
  <text x="48" y="1062" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">[CONFIRMAR] Se obra removida entra na quantidade de obras cadastradas.</text>
  <text x="48" y="1098" font-family="Segoe UI, sans-serif" font-size="22" fill="#111111">O painel não gera log e não mostra a mensagem de sucesso.</text>
</svg>
